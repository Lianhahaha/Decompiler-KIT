// ============================================================
//  Left 4 Dead 2 - Unlimited Arsenal (offline single-player)
//  Loaded from autoexec.cfg at every game launch.
//
//  Cheats are enabled server-side by cfg/listenserver.cfg, so
//  every local campaign map starts with sv_cheats 1 and
//  sv_infinite_ammo 1.
// ============================================================

// ---- Help -------------------------------------------------
echo "=================================================="
echo " L4D2 Unlimited Arsenal"
echo "  F6  god mode (toggle)          K  same"
echo "  F7  infinite ammo (toggle)     L  same"
echo "  F8  combat loadout + heal"
echo "  F9  supplies / throwables      J  same"
echo "  F10 noclip (toggle)            N  same"
echo "  F11 laser + explosive ammo     I  same"
echo "  G   next weapon (18-weapon cycle)"
echo "  P   refill ammo"
echo "  F4  print cheat status"
echo "  F5/F12 untouched (screenshot)"
echo "=================================================="

// ---- Core toggles ----------------------------------------
bind F6  "god"
bind F7  "incrementvar sv_infinite_ammo 0 1 1"
bind F10 "noclip"
bind K   "god"
bind L   "incrementvar sv_infinite_ammo 0 1 1"
bind N   "noclip"

// ---- Loadout / supplies ----------------------------------
alias l4d2_loadout  "give rifle; give autoshotgun; give hunting_rifle; give pistol_magnum; give ammo; give first_aid_kit; give pain_pills; give health; echo L4D2: combat loadout given"
alias l4d2_supplies "give first_aid_kit; give defibrillator; give pain_pills; give adrenaline; give pipe_bomb; give molotov; give vomitjar; give ammo; echo L4D2: supplies given"

bind F8 "l4d2_loadout"
bind F9 "l4d2_supplies"
bind J  "l4d2_supplies"
bind P  "give ammo; echo L4D2: ammo refilled"

// ---- Status ----------------------------------------------
bind F4 "sv_infinite_ammo; sv_cheats; echo L4D2: status above"

// ---- Weapon upgrades -------------------------------------
alias l4d2_upgrades "upgrade_add laser_sight; upgrade_add explosive_ammo; echo L4D2: laser + explosive ammo"
bind F11 "l4d2_upgrades"
bind I   "l4d2_upgrades"

// ---- Weapon cycle (G) ------------------------------------
// Each press gives the next gun and refills ammo.
alias l4d2_next l4d2_w1

alias l4d2_w1  "give rifle; give ammo; echo [1/18] M16 Assault Rifle; alias l4d2_next l4d2_w2"
alias l4d2_w2  "give rifle_ak47; give ammo; echo [2/18] AK-47; alias l4d2_next l4d2_w3"
alias l4d2_w3  "give rifle_desert; give ammo; echo [3/18] Desert Rifle; alias l4d2_next l4d2_w4"
alias l4d2_w4  "give rifle_sg552; give ammo; echo [4/18] SG552; alias l4d2_next l4d2_w5"
alias l4d2_w5  "give smg; give ammo; echo [5/18] SMG; alias l4d2_next l4d2_w6"
alias l4d2_w6  "give smg_silenced; give ammo; echo [6/18] Silenced SMG; alias l4d2_next l4d2_w7"
alias l4d2_w7  "give smg_mp5; give ammo; echo [7/18] MP5; alias l4d2_next l4d2_w8"
alias l4d2_w8  "give pumpshotgun; give ammo; echo [8/18] Pump Shotgun; alias l4d2_next l4d2_w9"
alias l4d2_w9  "give shotgun_chrome; give ammo; echo [9/18] Chrome Shotgun; alias l4d2_next l4d2_w10"
alias l4d2_w10 "give autoshotgun; give ammo; echo [10/18] Auto Shotgun; alias l4d2_next l4d2_w11"
alias l4d2_w11 "give shotgun_spas; give ammo; echo [11/18] SPAS-12; alias l4d2_next l4d2_w12"
alias l4d2_w12 "give hunting_rifle; give ammo; echo [12/18] Hunting Rifle; alias l4d2_next l4d2_w13"
alias l4d2_w13 "give sniper_military; give ammo; echo [13/18] Military Sniper; alias l4d2_next l4d2_w14"
alias l4d2_w14 "give sniper_awp; give ammo; echo [14/18] AWP; alias l4d2_next l4d2_w15"
alias l4d2_w15 "give sniper_scout; give ammo; echo [15/18] Scout; alias l4d2_next l4d2_w16"
alias l4d2_w16 "give pistol_magnum; give ammo; echo [16/18] Magnum; alias l4d2_next l4d2_w17"
alias l4d2_w17 "give grenade_launcher; give ammo; echo [17/18] Grenade Launcher; alias l4d2_next l4d2_w18"
alias l4d2_w18 "give chainsaw; give ammo; echo [18/18] Chainsaw; alias l4d2_next l4d2_w1"

bind G "l4d2_next"
